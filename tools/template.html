<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>問路小達人 · Pregunta el camino</title>
<style>
:root{--bg:#f6f4ee;--card:#fffefa;--ink:#2b2b2b;--muted:#8a867c;--line:#dcd8cd;--road:#e7e3d9;--ok:#6f8f72;--bad:#b5736a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.on{display:block}
.hidden{display:none!important}
h1{font-size:26px;margin:14px 0 2px;letter-spacing:.06em;font-weight:600}
.sub{color:var(--muted);margin:0 0 4px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.lbl{font-size:12px;color:var(--muted);margin:14px 0 6px}
input.name{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
input.name.err{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.levels{display:grid;gap:9px;margin-top:16px}
.lv{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--ink);background:var(--card);border-radius:16px;padding:12px 14px;cursor:pointer;width:100%}
.lv:active{background:var(--ink);color:#fff}
.lv .n{font-size:24px;font-weight:600;width:28px;text-align:center}
.lv .t{font-size:16px;font-weight:600}
.lv .d{font-size:12.5px;color:var(--muted)}
.lv:active .d{color:#ddd}
.lv .z{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.block{width:100%;margin-top:10px}
.mini{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.topmid{text-align:center;line-height:1.25}
.topmid b{font-size:14px;display:block}
.topmid span{font-size:12px;color:var(--muted)}
#score{font-size:13px;min-width:70px;text-align:right}
.bar{height:3px;background:var(--line);border-radius:3px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.zh{font-size:19px;line-height:1.75;letter-spacing:.03em}
.zh.listen{font-size:15px;color:var(--muted);letter-spacing:0}
.pyl{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:3px;white-space:pre-line}
.trl{font-size:13px;color:#5d5a52;line-height:1.5;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tools .mini{padding:5px 8px;font-size:12.5px}
.tog.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#btn-npart{border-color:var(--ink)}
.mapwrap{position:relative;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.maphead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 2px}
.mapname{font-size:12px;color:var(--muted)}
#btn-vocab{padding:3px 10px}
#map{width:100%;height:auto;max-height:42vh;display:block;margin:0 auto}
#map.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.road{stroke:var(--road);stroke-width:24;stroke-linecap:butt;fill:none}
.cw{fill:#f8f6f0}
.mid{stroke:#d5d0c3;stroke-width:1;stroke-dasharray:5 6;fill:none}
.bld rect{fill:#fffefa;stroke:#d3cec0;stroke-width:1.2}
.bld.hl rect{fill:#edf3ec;stroke:var(--ok);stroke-width:2.6}
.bn{font-size:15px;font-weight:600;fill:var(--ink)}
.bn.sm{font-size:13px}
.bp{font-size:8.2px;fill:var(--muted)}
.nd{fill:#bdb8aa}
.trail{fill:none;stroke:#a8a396;stroke-width:3;stroke-dasharray:2 6;stroke-linecap:round;stroke-linejoin:round}
.rt-bad{fill:none;stroke:var(--bad);stroke-width:5;stroke-dasharray:7 6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.rt-ok{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.cwm{stroke:#8a867c;stroke-width:5;stroke-linecap:round}
.cwm-ok{stroke:var(--ok);stroke-width:6;stroke-linecap:round}
.cwm-bad{stroke:var(--bad);stroke-width:6;stroke-linecap:round;stroke-dasharray:2 5}
.startring{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3}
#av,#avr{transition:transform .38s ease}
#av.nt,#avr.nt{transition:none}
.avc{fill:var(--ink)}.avt{fill:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0;line-height:1.5}
.hint b{color:var(--ink);font-weight:600}
#controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
#controls.c4{grid-template-columns:repeat(4,1fr);gap:6px}
#controls.c4 .cn{font-size:16px}
.cbtn{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:6px 4px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.cbtn:active{background:var(--ink);color:#fff}
.cbtn .ic{font-size:21px;line-height:1}
.cbtn .cn{font-size:17px;font-weight:600}
.cbtn .pyb{font-size:11px;color:var(--muted);white-space:pre-line;text-align:center;line-height:1.25}
.cbtn .sb{font-size:11px;color:var(--muted)}
.cbtn:active .pyb,.cbtn:active .sb{color:#ddd}
.row2{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:8px}
.row2 .btn{padding:10px}
#controls.off,.row2.off{opacity:.35;pointer-events:none}
#feedback{margin-top:10px}
.fb{border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:12px 14px}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb h3{margin:0 0 4px;font-size:16px}
.leg{font-size:12.5px;display:flex;gap:14px;margin:4px 0 8px;color:#5d5a52}
.leg i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.leg i.b{border-color:var(--bad);border-top-style:dashed}.leg i.g{border-color:var(--ok)}
.photo{margin:8px 0 10px}
.photo img{width:100%;max-height:170px;object-fit:cover;border-radius:12px;display:block}
.photo figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.fbbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbbtns.one{grid-template-columns:1fr}
#vocab{margin-top:8px}
#vocab .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
#vocab .g div span{color:var(--muted);font-size:11.5px;display:block;white-space:pre-line}
#vocab h4{margin:8px 0 4px;font-size:12px;color:var(--muted);font-weight:500}
.big{font-size:42px;font-weight:600;margin:10px 0 2px}
.res li{display:flex;gap:8px;font-size:13px;line-height:1.5;margin:6px 0;list-style:none}
.res{padding:0;margin:10px 0}
.res .m{width:18px;flex:none;text-align:center;font-weight:700}
.res .m.ok{color:var(--ok)}.res .m.bad{color:var(--bad)}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs .chip{flex:1;text-align:center;padding:7px 4px}
table.lb{width:100%;border-collapse:collapse;font-size:14px}
table.lb td,table.lb th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.lb th{font-size:12px;color:var(--muted);font-weight:500}
table.lb td:nth-child(1){width:30px;color:var(--muted)}
table.lb td:nth-child(3),table.lb td:nth-child(4),table.lb th:nth-child(3),table.lb th:nth-child(4){text-align:right}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:.95}
</style>
</head>
<body>
<div id="app">

<!-- ============ START ============ -->
<section id="s-start" class="screen on">
  <h1 id="ttl">問路小達人</h1>
  <p class="sub" id="ttlsub"></p>
  <p class="muted" id="tag"></p>

  <div class="lbl" id="l-name"></div>
  <input id="name" class="name" maxlength="14" autocomplete="off">

  <div class="lbl" id="l-script"></div>
  <div class="chips" id="c-script"></div>

  <div class="lbl" id="l-lang"></div>
  <div class="chips" id="c-lang"></div>

  <div class="lbl" id="l-map"></div>
  <div class="chips" id="c-map"></div>

  <div class="lbl" id="l-show"></div>
  <div class="chips" id="c-show"></div>

  <div class="lbl" id="l-phon"></div>
  <div class="chips" id="c-phon"></div>

  <div class="lbl" id="l-rate"></div>
  <div class="chips" id="c-rate"></div>

  <div class="lbl" id="l-level"></div>
  <div class="levels" id="levels"></div>

  <button class="btn ghost block" id="btn-board"></button>
</section>

<!-- ============ GAME ============ -->
<section id="s-game" class="screen">
  <div class="top">
    <button class="mini" id="btn-restart"></button>
    <div class="topmid"><b id="lvname"></b><span id="prog"></span></div>
    <div id="score"></div>
  </div>
  <div class="bar"><i id="barfill"></i></div>

  <div class="card" id="sentcard">
    <div class="zh" id="zh"></div>
    <div class="pyl" id="pyl"></div>
    <div class="trl" id="trl"></div>
    <div class="tools">
      <button class="mini" id="btn-say"></button>
      <button class="mini tog" id="btn-py"></button>
      <button class="mini" id="btn-rate"></button>
      <button class="mini hidden" id="btn-npart"></button>
    </div>
    <div class="tools">
      <button class="mini tog" id="btn-tx"></button>
      <button class="mini tog" id="btn-pt"></button>
    </div>
  </div>

  <div class="mapwrap">
    <div class="maphead"><div class="mapname" id="mapname"></div><button class="mini" id="btn-vocab">📖</button></div>
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img"></svg>
  </div>
  <div class="card hidden" id="vocab"></div>
  <div class="hint" id="hint"></div>

  <div id="controls">
    <button class="cbtn" id="b-L"></button>
    <button class="cbtn" id="b-S"></button>
    <button class="cbtn" id="b-R"></button>
    <button class="cbtn hidden" id="b-C"></button>
  </div>
  <div class="row2" id="row2">
    <button class="btn ghost" id="b-reset"></button>
    <button class="btn" id="b-go"></button>
  </div>
  <div id="feedback" class="hidden"></div>
</section>

<!-- ============ RESULT ============ -->
<section id="s-result" class="screen">
  <h1 id="r-title"></h1>
  <div class="card">
    <div class="muted" id="r-level"></div>
    <div class="big" id="r-score"></div>
    <div class="muted" id="r-time"></div>
    <div class="muted" id="r-saved"></div>
  </div>
  <ul class="res" id="r-list"></ul>
  <div class="fbbtns">
    <button class="btn" id="r-again"></button>
    <button class="btn ghost" id="r-board"></button>
  </div>
  <button class="btn ghost block" id="r-home"></button>
</section>

<!-- ============ BOARD ============ -->
<section id="s-board" class="screen">
  <h1 id="b-title"></h1>
  <p class="muted" id="b-note"></p>
  <div class="tabs" id="b-tabs"></div>
  <div class="card"><table class="lb" id="b-table"></table></div>
  <button class="btn ghost block" id="b-back"></button>
</section>

</div>
<div class="toast" id="toast"></div>

<script>

/* ===== 找不到中文聲音的提示（每天一分鐘遊戲統一做法）===== */
(function(){
  var shown=false;
  function cfg(){ var s={}; try{ s=JSON.parse(localStorage.getItem('hanziGames.settings')||'{}')||{}; }catch(e){} return s; }
  function isMandarin(v){ var l=String((v&&v.lang)||'').toLowerCase().replace(/_/g,'-'); if(l.indexOf('yue')===0||l.indexOf('zh-hk')===0) return false; return l==='zh'||l.indexOf('zh-')===0||l.indexOf('cmn')===0; }
  var T={
    none:{ zh:['這個裝置找不到中文（台灣）語音，聽不到念的內容。請到手機設定安裝「中文（台灣）」語音，或換一個裝置。','这个装置找不到中文（台湾）语音，听不到念的内容。请到手机设置安装「中文（台湾）」语音，或换一个装置。'],
           es:'No se encontró una voz de chino (Taiwán) en este dispositivo, así que no se oirá el audio. Instala la voz «chino (Taiwán)» en los ajustes del móvil o usa otro dispositivo.',
           en:'No Chinese (Taiwan) voice was found on this device, so you won’t hear the audio. Install the “Chinese (Taiwan)” voice in your phone settings, or use another device.' },
    nosynth:{ zh:['這個瀏覽器不支援語音，聽不到念的內容。請換一個瀏覽器（例如 Chrome、Safari）。','这个浏览器不支持语音，听不到念的内容。请换一个浏览器（例如 Chrome、Safari）。'],
           es:'Este navegador no admite voz, así que no se oirá el audio. Usa otro navegador (por ejemplo Chrome o Safari).',
           en:'This browser does not support speech, so you won’t hear the audio. Try another browser (for example Chrome or Safari).' }
  };
  function show(kind){
    if(shown||document.getElementById('hgVoiceHint')) return; shown=true;
    var s=cfg(), lang=s.lang||'es', simp=s.script==='simp', t=T[kind];
    var st=document.createElement('style');
    st.textContent='#hgVoiceHint{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:2147482999;width:min(94vw,520px);box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#fff6dc;border:1px solid #d8b24a;color:#5b4410;font:13px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}#hgVoiceHint .m{flex:1}#hgVoiceHint .m small{display:block;font-size:11px;opacity:.85;margin-top:2px}#hgVoiceHint button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}';
    document.head.appendChild(st);
    var d=document.createElement('div'); d.id='hgVoiceHint'; d.setAttribute('role','status');
    var m=document.createElement('div'); m.className='m';
    var zh=document.createElement('div'); zh.textContent = simp ? t.zh[1] : t.zh[0]; m.appendChild(zh);
    if(lang!=='zh'){ var sm=document.createElement('small'); sm.textContent = lang==='en' ? t.en : t.es; m.appendChild(sm); }
    var x=document.createElement('button'); x.type='button'; x.textContent='✕'; x.setAttribute('aria-label','Close');
    x.addEventListener('click',function(){ d.remove(); });
    d.appendChild(m); d.appendChild(x); document.body.appendChild(d);
  }
  function check(){
    try{
      if(!window.speechSynthesis){ show('nosynth'); return; }
      var vs=window.speechSynthesis.getVoices()||[];
      if(vs.length && !vs.some(isMandarin)) show('none');   // 清單是空的時（有些手機一開始就是空的）先不判斷
    }catch(e){}
  }
  function start(){
    check();
    try{ window.speechSynthesis.addEventListener('voiceschanged', check); }catch(e){}
    setTimeout(check,1500); setTimeout(check,4000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

/* ---------- shared settings (same key in every game of the family) ---------- */
function readShared() {
  const out = { script: 'trad', lang: 'es', phon: 'pinyin', rate: 'normal' };
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); } catch (e) {}
  if (saved && typeof saved === 'object') {
    Object.keys(SET_OPTS).forEach(k => { if (SET_OPTS[k].includes(saved[k])) out[k] = saved[k]; });
  }
  return out;
}
function writeShared() {
  try {
    let cur = {};
    try { cur = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; } catch (e) {}
    if (typeof cur !== 'object' || Array.isArray(cur)) cur = {};
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.assign(cur, { v: 1, script: S.script, lang: S.lang, phon: S.phon, rate: S.rate })));
  } catch (e) {}
}
// first run: no shared key yet -> bring over the old askdir_settings values (the old key keeps name etc.)
function migrateLegacy() {
  try {
    if (localStorage.getItem(SETTINGS_KEY) !== null) return;
    const raw = localStorage.getItem(OWN_KEY);
    if (!raw) return;
    const o = JSON.parse(raw) || {};
    const m = {};
    if (o.script === 'tw') m.script = 'trad'; else if (o.script === 'cn') m.script = 'simp';
    if (o.lang === 'es' || o.lang === 'en') m.lang = o.lang;
    if (o.pinyin === true) m.phon = 'pinyin'; else if (o.pinyin === false) m.phon = 'off';
    if (SET_OPTS.rate.includes(o.rate)) m.rate = o.rate;
    const base = Object.assign({ script: 'trad', lang: 'es', phon: 'pinyin', rate: 'normal' }, m);
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.assign({ v: 1 }, base)));
    ['script', 'lang', 'pinyin', 'trans', 'rate'].forEach(k => delete o[k]);   // keep only game-only data (name)
    localStorage.setItem(OWN_KEY, JSON.stringify(o));
  } catch (e) {}
}
function loadSettings() {
  migrateLegacy();
  Object.assign(S, readShared());
  try {
    const o = JSON.parse(localStorage.getItem(OWN_KEY) || '{}') || {};
    if (typeof o.name === 'string') S.name = o.name;
    if (typeof o.map === 'string') S.map = o.map;
    if (typeof o.showText === 'boolean') S.showText = o.showText;
    if (typeof o.partMode === 'boolean') S.partMode = o.partMode;
  } catch (e) {}
  const p = new URLSearchParams(location.search);
  if (p.get('name')) S.name = p.get('name').slice(0, 14);
  const sc = p.get('script');
  if (sc === 'tw' || sc === 'trad') S.script = 'trad'; else if (sc === 'cn' || sc === 'simp') S.script = 'simp';
  if (['es', 'en', 'zh'].includes(p.get('lang'))) S.lang = p.get('lang');
  if (S.map !== 'any' && !DATA.maps[S.map]) S.map = 'any';
}

const ZY = (function () {

  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, ROUNDS);
}

/* ---------- map drawing ---------- */
function labelSvg(cx, cy, key) {
  const b = DATA.buildings[key];
  const name = S.script === 'trad' ? b.tw : b.cn;
  // phonetic lines (pinyin and/or zhuyin), each split in two when the name has more than 2 syllables
  const lines = [];
  if (S.phon !== 'off') {
    const sy = b.py.split(' '), n = sy.length;
    const cut = n > 2 ? Math.ceil(n / 2) : n;
    if (S.phon === 'pinyin' || S.phon === 'both') { lines.push(sy.slice(0, cut).join(' ')); if (cut < n) lines.push(sy.slice(cut).join(' ')); }
    if (S.phon === 'zhuyin' || S.phon === 'both') { lines.push(ZY.conv(sy.slice(0, cut).join(' '))); if (cut < n) lines.push(ZY.conv(sy.slice(cut).join(' '))); }
  }
  const ny = cy + 5 - lines.length * 4.5;
  let s = '<text class="bn' + (name.length >= 4 ? ' sm' : '') + '" x="' + cx + '" y="' + ny + '" text-anchor="middle">' + name + '</text>';
  lines.forEach((ln, i) => { s += '<text class="bp" x="' + cx + '" y="' + (ny + 13 + i * 9) + '" text-anchor="middle">' + ln + '</text>'; });
  return s;
}
function renderMap() {
  const q = S.q, m = DATA.maps[q.map];

  svg.setAttribute('viewBox', '-34 -34 368 368');
  let h = '';
  for (let i = 0; i < 4; i++) {

    h += '<line class="road" x1="' + i * SP + '" y1="-20" x2="' + i * SP + '" y2="320"/>';
  }
  for (let i = 0; i < 4; i++) {
    h += '<line class="mid" x1="-20" y1="' + i * SP + '" x2="320" y2="' + i * SP + '"/>';
    h += '<line class="mid" x1="' + i * SP + '" y1="-20" x2="' + i * SP + '" y2="320"/>';
  }
  // crosswalks on every arm of every intersection
  for (let x = 0; x < 4; x++) for (let y = 0; y < 4; y++) {
    for (let d = 0; d < 4; d++) {
      const nx = x + DXS[d], ny = y + DYS[d];
      if (nx < 0 || nx > 3 || ny < 0 || ny > 3) continue;
      for (const off of [17, 23, 29]) {
        const cx = x * SP + DXS[d] * off, cy = y * SP + DYS[d] * off;

        else h += '<rect class="cw" x="' + (cx - 9) + '" y="' + (cy - 1.6) + '" width="18" height="3.2"/>';
      }
    }
  }
  for (let by = 0; by < 3; by++) for (let bx = 0; bx < 3; bx++) {
    const key = m.blocks[by][bx], cx = bx * SP + 50, cy = by * SP + 50;
    h += '<g class="bld" data-k="' + key + '"><rect x="' + (cx - 35) + '" y="' + (cy - 35) + '" width="70" height="70" rx="9"/>' + labelSvg(cx, cy, key) + '</g>';
  }
  for (let x = 0; x < 4; x++) for (let y = 0; y < 4; y++) h += '<circle class="nd" cx="' + x * SP + '" cy="' + y * SP + '" r="2.6"/>';
  h += '<circle class="startring" cx="' + q.start[0] * SP + '" cy="' + q.start[1] * SP + '" r="17"/>';
  h += '<g id="routes"></g><g id="cwm"></g><polyline class="trail" id="trail" points=""/>';
  h += '<g id="av"><g id="avr"><circle class="avc" r="11"/><path class="avt" d="M0 -22 L7 -11 L-7 -11 Z"/><circle r="3.4" fill="#fffefa"/></g></g>';
  svg.innerHTML = h;
}

function crossMark(c, cls) {

/* ---------- moving ---------- */
function applyAction(pos, a) {
  if (a === 'L') return { x: pos.x, y: pos.y, d: (pos.d + 3) % 4 };
  if (a === 'R') return { x: pos.x, y: pos.y, d: (pos.d + 1) % 4 };
  const nx = pos.x + DXS[pos.d], ny = pos.y + DYS[pos.d];
  if (nx < 0 || nx > 3 || ny < 0 || ny > 3) return null;
  return { x: nx, y: ny, d: pos.d };
}
function shakeMap(msg) {
  const m = $('#map'); m.classList.remove('shake'); void m.getBoundingClientRect(); m.classList.add('shake');
  toast(msg);
}
function act(a) {
  if (S.locked || S.busy || !S.q) return;
  if (S.actions.length >= 40) { toast('…'); return; }
  if (a === 'C') {
    if (S.level < 2) return;
    if (S.cr) { toast(T('alreadyCrossed')); return; }
    if (!applyAction(S.pos, 'S')) { shakeMap(T('noRoad')); return; }
    S.cr = true; S.crosses.push([S.pos.x, S.pos.y, S.pos.d]); S.actions.push('C');
    setAvatar(false); drawTrail(); return;
  }
  const np = applyAction(S.pos, a);
  if (!np) {
    const m = $('#map'); m.classList.remove('shake'); void m.getBoundingClientRect(); m.classList.add('shake');
    toast(T('noRoad')); return;
  }
  S.pos = np; S.actions.push(a); S.cr = false;
  if (a === 'L') S.ang -= 90; else if (a === 'R') S.ang += 90; else S.path.push([np.x, np.y]);
  setAvatar(false); drawTrail();
}
function resetPos() {
  if (S.locked || S.busy) return;
  const q = S.q;
  S.pos = { x: q.start[0], y: q.start[1], d: q.start[2] };

function submit() {
  if (S.locked || S.busy || !S.q) return;
  const q = S.q, p = S.pos;
  const sameNode = p.x === q.end[0] && p.y === q.end[1];
  const faceOK = p.d === q.end[2];
  const crossOK = JSON.stringify(S.crosses) === JSON.stringify(q.crosses);
  const ok = sameNode && faceOK && crossOK;
  S.locked = true;
  S.totalMs += Math.min(Date.now() - S.qStart, 120000);
  if (ok) S.correct++;
  S.results.push({ ok, q });
  S.reveal = { ok, sameNode, faceOK, student: S.path.slice(), crosses: S.crosses.slice() };
  $('#controls').classList.add('off'); $('#row2').classList.add('off');
  renderSentence();
  drawTrail(); drawReveal(); stopSpeech();
  renderFeedback();
  track('answer', { level: S.level, id: q.id, correct: ok ? 1 : 0 });
  setTimeout(() => $('#feedback').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
}
function renderFeedback() {
  if (!S.reveal) return;

  const last = S.qi >= S.qs.length - 1;

  if (!ok) html += '<div class="leg"><span><i class="b"></i>' + T('yourRoute') + '</span><span><i class="g"></i>' + T('rightRoute') + '</span></div>';
  html += '<figure class="photo"><img src="' + PHOTO_DIR + S.q.target + '.jpg" alt="" onerror="this.parentNode.remove()"><figcaption></figcaption></figure>';
  html += '<div class="fbbtns' + (ok ? ' one' : '') + '">';
  if (!ok) html += '<button class="btn ghost" id="fb-watch">' + T('watch') + '</button>';

async function replay() {
  if (S.busy) return;
  S.busy = true;
  const q = S.q;
  S.pos = { x: q.start[0], y: q.start[1], d: q.start[2] }; S.ang = q.start[2] * 90; S.cr = false;
  S.path = [[S.pos.x, S.pos.y]]; setAvatar(true); drawTrail();
  await sleep(450);
  for (const a of q.actions) {
    if (a === 'C') { S.cr = true; setAvatar(false); await sleep(650); continue; }
    const np = applyAction(S.pos, a); if (!np) break;
    S.pos = np; S.cr = false;
    if (a === 'L') S.ang -= 90; else if (a === 'R') S.ang += 90; else S.path.push([np.x, np.y]);
    setAvatar(false); drawTrail();
    await sleep(a === 'S' ? 700 : 480);
  }
  S.busy = false;
}

/* ---------- leaderboard ---------- */
let FB = null;
async function initFirebase() {
  if (!FIREBASE_CONFIG || FB) return FB;
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const app = A.initializeApp(FIREBASE_CONFIG);
    const auth = Au.getAuth(app);
    let uid = null;
    try { uid = (await Au.signInAnonymously(auth)).user.uid; } catch (e) {}
    FB = { db: F.getFirestore(app), F, uid };
  } catch (e) { FB = null; }
  return FB;
}
function localLB() { try { return JSON.parse(localStorage.getItem('askdir_lb') || '{}'); } catch (e) { return {}; } }
function better(a, b) { return !b || a.score > b.score || (a.score === b.score && a.time < b.time); }
async function saveScore(level, score, time) {
  const rec = { name: S.name, score, time, level };
  let remote = false;
  const lb = localLB(); if (better(rec, lb['L' + level])) lb['L' + level] = rec;
  try { localStorage.setItem('askdir_lb', JSON.stringify(lb)); } catch (e) {}
  const fb = await initFirebase();
  if (fb) {
    try {
      const { F, db, uid } = fb;
      if (!uid) throw new Error('no auth');
      const ref = F.doc(db, LB_PREFIX + level, uid);
      const snap = await F.getDoc(ref);
      if (!snap.exists() || better(rec, snap.data())) await F.setDoc(ref, { name: rec.name, score: rec.score, time: rec.time, level: rec.level, updatedAt: F.serverTimestamp() });
      remote = true;
    } catch (e) { remote = false; }
  }
  return remote;
}
async function fetchBoard(level) {
  const fb = await initFirebase();
  if (fb) {
    try {
      const { F, db } = fb;
      const snap = await F.getDocs(F.query(F.collection(db, LB_PREFIX + level), F.orderBy('score', 'desc'), F.limit(30)));
      const rows = snap.docs.map(d => d.data());
      rows.sort((a, b) => b.score - a.score || a.time - b.time);
      return { rows: rows.slice(0, 10), remote: true };
    } catch (e) {}
  }
  const r = localLB()['L' + level];
  return { rows: r ? [r] : [], remote: false };
}

  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    h += '<tr><td>' + (i + 1) + '</td><td></td><td>' + r.score + '</td><td>' + r.time + '</td></tr>';
  });
  t.innerHTML = h;
  [...t.querySelectorAll('tr')].slice(1).forEach((tr, i) => { tr.children[1].textContent = rows[i].name; });
}

/* ---------- vocabulary panel ---------- */
function toggleVocab() {
  const v = $('#vocab');
  if (!v.classList.contains('hidden')) { v.classList.add('hidden'); return; }
  const m = DATA.maps[S.q.map];
  v.innerHTML = '<h4>' + T('vocabDir') + '</h4><div class="g" id="vg1"></div><h4>' + T('vocabWords') + '</h4><div class="g" id="vg3"></div><h4>' + T('vocabPlaces') + '</h4><div class="g" id="vg2"></div>';
  const fill = (id, rows) => {
    const g = $(id);
    rows.forEach(r => {
      const d = document.createElement('div');
      const b = document.createElement('b'); b.textContent = r[0]; d.appendChild(b);
      const ph = phText(r[1]);
      if (ph) { const p = document.createElement('span'); p.textContent = ph; d.appendChild(p); }
      if (showTrans()) { const t = document.createElement('span'); t.textContent = r[2]; d.appendChild(t); }
      g.appendChild(d);
    });
  };
  fill('#vg1', ['straight', 'left', 'right', 'cross'].map(k => [W(k), WPY[k], (WTR[S.lang] || {})[k]]));
  fill('#vg3', USEFUL.map(u => [u[sk()], u.py, u[S.lang]]));
  const keys = [];
  m.blocks.forEach(r => r.forEach(k => keys.push(k)));
  fill('#vg2', keys.map(k => { const b = DATA.buildings[k]; return [S.script === 'trad' ? b.tw : b.cn, b.py, b[S.lang]]; }));
  v.classList.remove('hidden');
}
// re-draw whatever screen is showing after the settings changed (e.g. in another tab)
function refreshAll() {
  if ($('#s-start').classList.contains('on')) { S.name = $('#name').value; renderStart(); }
  else if ($('#s-game').classList.contains('on') && S.q) {
    const vopen = !$('#vocab').classList.contains('hidden');
    applyGameLabels(); renderSentence(); renderMap(); redraw(); renderFeedback();
    $('#vocab').classList.add('hidden'); if (vopen) toggleVocab();
  }
  else if ($('#s-result').classList.contains('on')) paintResult();
  else if ($('#s-board').classList.contains('on')) openBoard(boardLevel);
}
window.addEventListener('storage', e => {
  if (e.key !== null && e.key !== SETTINGS_KEY) return;
  Object.assign(S, readShared());
  refreshAll();
});

/* ---------- wiring ---------- */
function bind() {
  $('#b-L').onclick = () => act('L');
  $('#b-S').onclick = () => act('S');
  $('#b-R').onclick = () => act('R');
  $('#b-C').onclick = () => act('C');
  $('#btn-npart').onclick = nextPart;
  $('#btn-tx').onclick = () => { S.showText = !S.showText; saveSettings(); refreshAll(); };
  $('#btn-pt').onclick = () => { S.partMode = !S.partMode; S.partIdx = 0; saveSettings(); refreshAll(); if (S.partMode) speakCurrent(); };
  $('#b-reset').onclick = resetPos;
  $('#b-go').onclick = submit;
  $('#btn-say').onclick = speakCurrent;
  $('#btn-py').onclick = () => { const o = SET_OPTS.phon; S.phon = o[(o.indexOf(S.phon) + 1) % o.length]; saveSettings(); refreshAll(); };
  $('#btn-rate').onclick = () => { const o = ['slow', 'normal', 'fast']; S.rate = o[(o.indexOf(S.rate) + 1) % 3]; saveSettings(); $('#btn-rate').textContent = '⏱ ' + T(S.rate); speakCurrent(); };
  $('#btn-vocab').onclick = toggleVocab;
  $('#btn-restart').onclick = () => { stopSpeech(); startGame(S.level); };
  $('#btn-board').onclick = () => openBoard(1);
  $('#r-again').onclick = () => startGame(S.level);
  $('#r-board').onclick = () => openBoard(S.level);
  $('#r-home').onclick = () => { renderStart(); show('s-start'); };
  $('#b-back').onclick = () => { renderStart(); show('s-start'); };
  $('#name').addEventListener('input', () => $('#name').classList.remove('err'));
  document.addEventListener('keydown', e => {
    if (!$('#s-game').classList.contains('on') || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') act('L'); else if (e.key === 'ArrowRight') act('R'); else if (e.key === 'ArrowUp') { e.preventDefault(); act('S'); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); act('C'); }
    else if (e.key === 'Enter') { if (!S.locked) submit(); else if ($('#fb-next')) nextQuestion(); }
  });
}
loadSettings(); bind(); renderStart();
function loadSpecific(q) {   // used by the automated tests
  S.level = q.level; S.qs = [q]; S.qi = 0; S.correct = 0; S.results = []; S.totalMs = 0;
  show('s-game'); applyGameLabels(); loadQuestion();
}
window.__askdir = { S, DATA, act, submit, startGame, nextQuestion, nextPart, resetPos, loadSpecific, fullTxt, replay };
</script>

<script>
/* ===== 遊玩紀錄（hgPlays）— 每個遊戲共用，貼在 </body> 前 =====
   用法：
     HGPlays.visit();                       // 頁面打開時（本檔會自動呼叫一次）
     HGPlays.start('easy', '小明');         // 真的開始玩一局（關卡／難度、暱稱都可省略）
     HGPlays.end({score: 120, name: '小明'}); // 這一局正常結算（score、name 可省略）
   沒呼叫 end 的那一局，後台就會顯示「沒玩完」。
   寫到 memorma 專案：plays（每局）、visits（每台裝置每天每遊戲一筆）。
   任何錯誤都靜默，不影響遊戲。 */
(function () {
  var GAME = 'perdido';          // ← 每個遊戲改成自己的代號（英文小寫、底線）
  var NAME_GETTER = null;                // ← 可選：function(){ return 目前暱稱或'' }
  var CFG = { apiKey: 'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60', authDomain: 'memorma-24dab.firebaseapp.com',
              projectId: 'memorma-24dab', appId: '1:806709458465:web:f0d12acb2f911f2f165560' };
  var V = '10.12.2', CDN = 'https://www.gstatic.com/firebasejs/' + V + '/';
  var cur = null, readyP = null, lib = null;

  function gid() { try { return (HG.gameFn ? HG.gameFn() : GAME) || GAME; } catch (e) { return GAME; } } // taiwan-life 這類共用引擎的遊戲可改寫 HGPlays.gameFn
  function day() { // 以台灣時間（UTC+8）算「哪一天」，方便老師對帳
    var d = new Date(Date.now() + 8 * 3600e3);
    return d.toISOString().slice(0, 10);
  }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function ready() {
    if (readyP) return readyP;
    readyP = (async function () {
      var A = await import(CDN + 'firebase-app.js');
      var Au = await import(CDN + 'firebase-auth.js');
      var F = await import(CDN + 'firebase-firestore.js');
      var app = A.initializeApp(CFG, 'hgplays');
      var auth = Au.getAuth(app);
      if (!auth.currentUser) await Au.signInAnonymously(auth);
      else await auth.authStateReady();
      lib = { F: F, db: F.getFirestore(app), uid: auth.currentUser.uid };
      return lib;
    })().catch(function () { readyP = null; return null; });
    return readyP;
  }
  function getName(n) {
    if (n) return String(n).slice(0, 36);
    try { if (NAME_GETTER) return String(NAME_GETTER() || '').slice(0, 36); } catch (e) {}
    return '';
  }

  var HG = window.HGPlays = {
    /* 每台裝置每天、每個遊戲只算一次訪客 */
    visit: function () {
      var g = gid(), d = day(), key = 'hg.visit.' + g;
      if (ls(key) === d) return;
      ready().then(function (L) {
        if (!L) return;
        var id = d + '_' + g + '_' + L.uid;
        return L.F.setDoc(L.F.doc(L.db, 'visits', id), { game: g, day: d, uid: L.uid, at: L.F.serverTimestamp() })
          .then(function () { ls(key, d); });
      }).catch(function () {});
    },
    /* 真的開始玩一局 */
    start: function (level, name) {
      var mine = cur = { id: null, level: level == null ? '' : String(level).slice(0, 30) };
      ready().then(function (L) {
        if (!L) return;
        var data = { game: gid(), level: mine.level, uid: L.uid, name: getName(name), day: day(),
                     startedAt: L.F.serverTimestamp(), done: false };
        return L.F.addDoc(L.F.collection(L.db, 'plays'), data).then(function (ref) {
          mine.id = ref.id; if (mine.pendingEnd) HG._finish(mine, mine.pendingEnd);
        });
      }).catch(function () {});
    },
    /* 這一局正常結算 */
    end: function (info) {
      var mine = cur; if (!mine || mine.ended) return; mine.ended = true; info = info || {};
      if (mine.id) HG._finish(mine, info); else mine.pendingEnd = info; // 開始的寫入還沒回來就先記著
    },
    _finish: function (mine, info) {
      ready().then(function (L) {
        if (!L || !mine.id) return;
        var u = { done: true, endedAt: L.F.serverTimestamp(),
                  secs: Math.max(0, Math.min(86400, Math.round(Number(info.secs != null ? info.secs : (Date.now() - (mine.t0 || Date.now())) / 1000) || 0))) };
        var s = Number(info.score); if (isFinite(s) && info.score != null) u.score = Math.max(-1e9, Math.min(1e9, Math.round(s)));
        var n = getName(info.name); if (n) u.name = n;
        return L.F.updateDoc(L.F.doc(L.db, 'plays', mine.id), u);
      }).catch(function () {});
    }
  };
  var _s = HG.start; HG.start = function (l, n) { _s(l, n); if (cur) cur.t0 = Date.now(); };
  setTimeout(function () { HG.visit(); }, 2500);   // 等遊戲載完再記訪客
})();
</script>
