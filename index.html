<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>問路小達人 · Pregunta el camino</title>
<style>
html{color-scheme:light}
:root{--bg:#f6f4ee;--card:#fffefa;--ink:#2b2b2b;--muted:#8a867c;--line:#dcd8cd;--road:#e7e3d9;--ok:#6f8f72;--bad:#b5736a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{padding-bottom:26px}
html,body{margin:0;overflow-x:hidden;overscroll-behavior-x:none;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit;touch-action:manipulation}
body{touch-action:pan-y pinch-zoom}
#app{max-width:520px;margin:0 auto;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.on{display:block}
.hidden{display:none!important}
h1{font-size:27px;margin:0;letter-spacing:.06em;font-weight:600}
.plaque{flex:none;display:inline-block;margin:0 0 3px 2px;padding:5px 14px;border:2.5px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--ink)}
.headrow{display:flex;align-items:center;gap:12px;margin-top:2px}
.hero{flex:1 1 auto;min-width:0;max-width:185px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 6px 2px}
.hero svg{display:block;width:100%;height:auto}
.walker{transform:translate(40px,73px);animation:stroll 7s ease-in-out infinite}
@keyframes stroll{0%,8%{transform:translate(40px,73px)}78%,100%{transform:translate(216px,73px)}}
@media (prefers-reduced-motion:reduce){.walker{animation:none;transform:translate(130px,73px)}}
.sub{color:var(--muted);margin:0 0 4px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.lbl{font-size:12px;color:var(--muted);margin:14px 0 6px}
input.name{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
input.name.err{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.frow{display:flex;align-items:center;gap:10px;margin-top:12px}
.frow .lbl{margin:0;flex:none;width:74px;line-height:1.25;font-size:11px}
.frow .lbl .bi,.frow .lbl .bz,.frow .lbl .bf{display:block}
.frow .lbl .bz{font-size:14px;color:var(--ink)}
.frow .lbl .bf::before{content:''}
.frow input.name{flex:1 1 auto;min-width:0}
@media(max-width:340px){.headrow .hero{display:none}}
.levels{display:grid;gap:7px;margin-top:12px;position:relative;padding-left:31px}
.levels::before{content:'';position:absolute;left:12px;top:20px;bottom:20px;width:3px;border-radius:2px;background:var(--ink);opacity:.85}
.lv{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--ink);background:var(--card);border-radius:13px;padding:6px 12px;cursor:pointer;width:100%}
.lv:active{background:var(--ink);color:#fff}
.lv{position:relative}
.lv .n{position:absolute;left:-31px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--bg);border:2.5px solid var(--ink);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink)}
.lv:last-child .n{background:var(--ink);color:#fff}
.lv .t{font-size:14.5px;font-weight:600}
.lv .d{font-size:11.5px;color:var(--muted)}
.lv:active .d{color:#ddd}
.lv .t .bi,.lv .t .bz,.lv .t .bf{display:inline}.lv .t .bf::before{content:' \00b7  '}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.block{width:100%;margin-top:10px}
.mini{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.topmid{text-align:center;line-height:1.25}
.topmid b{font-size:14px;display:block}
.topmid span{font-size:12px;color:var(--muted)}
#score{font-size:13px;min-width:44px;text-align:right}
.bar{height:3px;background:var(--line);border-radius:3px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.sentrow{display:flex;gap:10px;align-items:flex-start}
.sentrow .zh{flex:1 1 auto;min-width:0}
.zh{font-size:15.5px;line-height:1.45;letter-spacing:.03em}
.zh.listen{font-size:15px;color:var(--muted);letter-spacing:0}
.pyl{font-size:10.5px;color:var(--muted);line-height:1.3;margin-top:6px;white-space:pre-line}
.trl{font-size:12px;color:#5d5a52;line-height:1.3;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:5px}
.tools .mini:not(.hidden){margin-top:6px}
#btn-say{flex:none}
.tools .mini{padding:5px 8px;font-size:12.5px}
.tog.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#btn-npart,#btn-reveal,#btn-reveal2{border-color:var(--ink)}
.sentrow #btn-reveal{flex:1 1 auto;min-width:0}
#sentcard{padding:7px 12px;position:relative}
.mapwrap{position:relative;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.maphead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 2px}
.mapname{font-size:12px;color:var(--muted);flex:1 1 auto;min-width:0}
.maphead>span{display:flex;gap:6px;flex:none}
#btn-cam{padding:3px 10px}
#btn-vocab{flex:none;padding:5px 10px;font-size:12.5px;border-color:var(--ink)}
#btn-restart{white-space:nowrap}
@media(max-width:340px){#btn-restart{padding:6px 7px}}
.sentrow.s0{align-items:stretch}
.sentrow.s0 #btn-vocab{font-size:13px}
.tools{align-items:stretch}
#btn-reveal2{flex:1 1 0;min-width:0}
#map.big{max-height:44vh}
#map{width:100%;height:auto;max-height:38vh;display:block;margin:0 auto}
#map.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.road{stroke:var(--road);stroke-width:24;stroke-linecap:butt;fill:none}
.cw{fill:#f8f6f0}
.mid{stroke:#d5d0c3;stroke-width:1;stroke-dasharray:5 6;fill:none}
.bld rect{fill:#fffefa;stroke:#d3cec0;stroke-width:1.2}
.bld.hl rect{fill:#edf3ec;stroke:var(--ok);stroke-width:2.6}
.bn{font-size:15px;font-weight:600;fill:var(--ink)}
.bn.sm{font-size:13px}
.bp{font-size:8.2px;fill:var(--muted)}
.nd{fill:#bdb8aa}
.trail{fill:none;stroke:#a8a396;stroke-width:3;stroke-dasharray:2 6;stroke-linecap:round;stroke-linejoin:round}
.rt-bad{fill:none;stroke:var(--bad);stroke-width:5;stroke-dasharray:7 6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.rt-ok{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.cwm{stroke:#8a867c;stroke-width:5;stroke-linecap:round}
.cwm-ok{stroke:var(--ok);stroke-width:6;stroke-linecap:round}
.cwm-bad{stroke:var(--bad);stroke-width:6;stroke-linecap:round;stroke-dasharray:2 5}
.goalmk{opacity:.85}.gring{fill:none;stroke:var(--ok);stroke-width:2.5;stroke-dasharray:4 3}.goalmk .avp{filter:saturate(.6)}
.startring{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3}
#av,#avr{transition:transform .38s ease}
#av.nt,#avr.nt{transition:none}
.avc{fill:var(--ink)}.avt{fill:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0;line-height:1.5}
.hint b{color:var(--ink);font-weight:600}
#controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
#controls.c4{grid-template-columns:repeat(4,1fr);gap:6px}
#controls.c4 .cn{font-size:16px}
#exits{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
#exits .cbtn{min-height:42px;gap:0;padding:2px 4px}#exits .cbtn .ic{font-size:16px}
#exits.off{display:none}
#exits .cn{font-size:13px;text-align:center}
.cbtn{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:6px 4px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.cbtn:active{background:var(--ink);color:#fff}
.cbtn{display:grid;grid-template-columns:auto auto;justify-content:center;align-content:center;column-gap:6px;row-gap:0;min-height:44px;padding:4px}
.cbtn .sb{grid-column:1/-1;text-align:center;font-size:10.5px;line-height:1.2}
.cbtn .ic{align-self:center}
.cbtn .ic{font-size:18px;line-height:1}
.cbtn .cn{font-size:17px;font-weight:600}
.cbtn .pyb{display:none;font-size:11px;color:var(--muted);white-space:pre-line;text-align:center;line-height:1.25}
.cbtn .sb{font-size:11px;color:var(--muted)}
.cbtn:active .pyb,.cbtn:active .sb{color:#ddd}
.row2{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:8px}
#dock{flex:none;padding-top:8px}
#dock #controls{margin-top:0}
#dock.off{display:none}
#s-game.on{display:flex;flex-direction:column;height:calc(100svh - 60px);min-height:420px}
body:has(#s-game.on){padding-bottom:0}
body:has(#s-game.on) #hgCopy{font-size:8px!important;line-height:1.3!important;padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px))!important;white-space:nowrap;overflow:hidden}
@media(max-width:375px){body:has(#s-game.on) #hgCopy{white-space:normal!important;text-align:center!important;font-size:7.5px!important}}
#s-game.on>*{flex:none}
#s-game.on>.mapwrap{flex:1 1 auto;min-height:190px;display:flex;flex-direction:column}
#s-game.on #map,#s-game.on #map.big{flex:1 1 auto;min-height:0;height:100%;max-height:none}
#s-game.on.locked{height:auto;min-height:0}
#s-game.on.locked>.mapwrap{flex:none;display:block}
#s-game.on.locked #map,#s-game.on.locked #map.big{height:auto;max-height:38svh}
.row2 .btn{padding:5px 8px}
.row2 .btn .bi,.row2 .btn .bz,.row2 .btn .bf{display:inline}
.row2 .btn .bf{opacity:.65}
.row2 .btn .bf::before{content:" "}
@media(max-width:380px){.row2{grid-template-columns:1fr 1fr;gap:6px}.row2 .btn{padding:5px 4px;font-size:13px}.row2 .btn .bf{font-size:.78em}.row2 .btn .bf::before{content:""}}
#controls.off,.row2.off{opacity:.35;pointer-events:none}
#feedback{margin-top:10px}
.fb{border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:12px 14px}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb h3{margin:0 0 4px;font-size:16px}
.leg{font-size:12.5px;display:flex;gap:14px;margin:4px 0 8px;color:#5d5a52}
.leg i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.leg i.b{border-color:var(--bad);border-top-style:dashed}.leg i.g{border-color:var(--ok)}
.photo{margin:8px 0 10px}
.photo img{width:100%;max-height:170px;object-fit:cover;border-radius:12px;display:block}
.photo figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.fbbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbbtns.one{grid-template-columns:1fr}
#vocab{margin-top:8px}
#vocab .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
#vocab .g div{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;line-height:1.25}
#vocab .g div b{font-size:22px;font-weight:600}
#vocab .g div span{color:var(--muted);font-size:14px;white-space:pre-line}
#vocab .g div span.fo{flex:0 0 100%}
#vocab h4{margin:8px 0 4px;font-size:14px;color:var(--muted);font-weight:500}
.big{font-size:42px;font-weight:600;margin:10px 0 2px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs .chip{flex:1;text-align:center;padding:7px 4px}
table.lb{width:100%;border-collapse:collapse;font-size:14px}
table.lb td,table.lb th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.lb th{font-size:12px;color:var(--muted);font-weight:500}
table.lb td:nth-child(1){width:30px;color:var(--muted)}
table.lb td:nth-child(3),table.lb td:nth-child(4),table.lb th:nth-child(3),table.lb th:nth-child(4){text-align:right}
.iconbar{display:flex;gap:6px;align-items:center}
.iconbar .mini{padding:5px 9px;font-size:16px;line-height:1}
.startbar{display:flex;justify-content:flex-end;margin-bottom:8px}
.topr{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.modal{position:fixed;inset:0;background:rgba(43,43,43,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheethead b{font-size:17px}
.help{margin:6px 0 0;padding:0;list-style:none}
.help li{font-size:14.5px;line-height:1.6;margin:9px 0}
.bi{display:inline-block;vertical-align:top;line-height:1.3}
.bi .bz,.bi .bf{display:block}
.bi .bf{font-size:.74em;opacity:.6;font-weight:400;margin-top:1px;line-height:1.25}
.chip .bi,.btn .bi,.mini .bi,.lv .bi,.cbtn .bi{text-align:inherit}
.chip .bi,.btn .bi,.mini .bi{text-align:center}
.lbl .bi,.topmid .bi,#score .bi,#prog .bi,.sheethead .bi,.fb h3 .bi,.leg .bi{display:inline}
.lbl .bz,.lbl .bf,.topmid .bz,.topmid .bf,#score .bz,#score .bf,#prog .bz,#prog .bf,.sheethead .bz,.sheethead .bf,.fb h3 .bz,.fb h3 .bf,.leg .bz,.leg .bf{display:inline}
.lbl .bf::before,.topmid .bf::before,#score .bf::before,#prog .bf::before,.sheethead .bf::before,.fb h3 .bf::before,.leg .bf::before{content:' '}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom) + var(--dockh,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:.95}
</style>

<body>
<div id="app">

<!-- ============ START ============ -->
<section id="s-start" class="screen on">
  <div class="startbar"><span class="iconbar"><button class="mini" id="i-set"></button><button class="mini" id="i-help"></button></span></div>
  <div class="headrow"><div class="plaque"><h1 id="ttl">問路小達人</h1></div><div class="hero" id="hero"></div></div>

  <div class="frow"><div class="lbl" id="l-name"></div><input id="name" class="name" maxlength="14" autocomplete="off"></div>

  <div class="lbl" id="l-level"></div>
  <div class="levels" id="levels"></div>

  <button class="btn ghost block" id="btn-board"></button>
</section>

<!-- ============ GAME ============ -->
<section id="s-game" class="screen">
  <div class="top">
    <button class="mini" id="btn-restart"></button>
    <div class="topmid"><b id="lvname"></b><span id="prog"></span></div>
    <div class="topr"><span id="score"></span><span class="iconbar"><button class="mini" id="g-set"></button><button class="mini" id="g-help"></button></span></div>
  </div>
  <div class="bar"><i id="barfill"></i></div>

  <div class="card" id="sentcard">
    <div class="sentrow"><button class="mini" id="btn-reveal"></button><div class="zh hidden" id="zh"></div><button class="mini" id="btn-say"></button></div>
    <div class="pyl" id="pyl"></div>
    <div class="trl" id="trl"></div>
    <div class="tools" id="tools">
      <button class="mini hidden" id="btn-reveal2"></button>
      <button class="mini" id="btn-vocab"></button>
      <button class="mini hidden" id="btn-npart"></button>
    </div>
  </div>

  <div class="mapwrap">
    <div class="maphead"><div class="mapname" id="mapname"></div><span><button class="mini hidden" id="btn-cam"></button></span></div>
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img"></svg>
  </div>
  <div class="hint hidden" id="hint"></div>

  <div id="dock">
  <div id="controls">
    <button class="cbtn" id="b-L"></button>
    <button class="cbtn" id="b-S"></button>
    <button class="cbtn" id="b-R"></button>
    <button class="cbtn hidden" id="b-C"></button>
  </div>
  <div id="exits" class="hidden">
    <button class="cbtn" id="b-1"></button>
    <button class="cbtn" id="b-2"></button>
    <button class="cbtn" id="b-3"></button>
    <button class="cbtn" id="b-4"></button>
  </div>
  <div class="row2" id="row2">
    <button class="btn ghost" id="b-reset"></button>
    <button class="btn" id="b-go"></button>
  </div>
  </div>
  <div id="feedback" class="hidden"></div>
</section>

<!-- ============ RESULT ============ -->
<section id="s-result" class="screen">
  <h1 id="r-title"></h1>
  <div class="card">
    <div class="muted" id="r-level"></div>
    <div class="big" id="r-score"></div>
    <div class="muted" id="r-time"></div>
    <div class="muted" id="r-saved"></div>
  </div>
  <div class="fbbtns">
    <button class="btn" id="r-again"></button>
    <button class="btn ghost" id="r-board"></button>
  </div>
  <button class="btn ghost block" id="r-home"></button>
</section>

<!-- ============ BOARD ============ -->
<section id="s-board" class="screen">
  <h1 id="b-title"></h1>
  <p class="muted" id="b-note"></p>
  <div class="tabs" id="b-tabs"></div>
  <div class="card"><table class="lb" id="b-table"></table></div>
  <button class="btn ghost block" id="b-back"></button>
</section>

</div>
<div class="toast" id="toast"></div>
<div class="modal hidden" id="modal">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheethead"><b id="m-title"></b><button class="mini" id="m-close" aria-label="close">✕</button></div>
    <div id="vocab" class="hidden"></div>
    <div id="pane-leave" class="hidden"><p id="leave-msg" style="margin:4px 0 8px"></p><button class="btn block" id="lv-keep"></button><button class="btn ghost block" id="lv-re"></button><button class="btn ghost block" id="lv-home"></button></div>
    <div id="pane-set" class="hidden">
      <div class="lbl" id="l-script"></div>
      <div class="chips" id="c-script"></div>
      <div class="lbl" id="l-lang"></div>
      <div class="chips" id="c-lang"></div>
      <div class="lbl" id="l-show"></div>
      <div class="chips" id="c-show"></div>
      <div class="lbl" id="l-phon"></div>
      <div class="chips" id="c-phon"></div>
      <div class="lbl" id="l-rate"></div>
      <div class="chips" id="c-rate"></div>
    </div>
    <ol id="pane-help" class="help hidden"></ol>
  </div>
</div>

<script>

/* ===== 找不到中文聲音的提示（每天一分鐘遊戲統一做法）===== */
(function(){
  var shown=false;
  function cfg(){ var s={}; try{ s=JSON.parse(localStorage.getItem('hanziGames.settings')||'{}')||{}; }catch(e){} return s; }

  return FB;
}
function localLB() { try { return JSON.parse(localStorage.getItem('askdir_lb') || '{}'); } catch (e) { return {}; } }
function better(a, b) { return !b || a.score > b.score || (a.score === b.score && a.time < b.time); }
async function saveScore(level, score, time) {
  const rec = { name: S.name, score, time, level };
  let remote = false;
  const lb = localLB(); if (better(rec, lb['L' + level])) lb['L' + level] = rec;
  try { localStorage.setItem('askdir_lb', JSON.stringify(lb)); } catch (e) {}
  const fb = await initFirebase();
  if (fb) {
    try {
      const { F, db, uid } = fb;
      if (!uid) throw new Error('no auth');
      const ref = F.doc(db, LB_PREFIX + level, uid);
      const snap = await F.getDoc(ref);
      if (!snap.exists() || better(rec, snap.data())) await F.setDoc(ref, { name: rec.name, score: rec.score, time: rec.time, level: rec.level, updatedAt: F.serverTimestamp() });
      remote = true;
    } catch (e) { remote = false; }
  }
  return remote;
}
async function fetchBoard(level) {
  const fb = await initFirebase();
  if (fb) {
    try {
      const { F, db } = fb;
      const snap = await F.getDocs(F.query(F.collection(db, LB_PREFIX + level), F.orderBy('score', 'desc'), F.limit(30)));
      const rows = snap.docs.map(d => d.data());
      rows.sort((a, b) => b.score - a.score || a.time - b.time);
      return { rows: rows.slice(0, 10), remote: true };
    } catch (e) {}
  }
  const r = localLB()['L' + level];
  return { rows: r ? [r] : [], remote: false };
}

/* ---------- result & board screens ---------- */
async function finish() {
  const score = S.correct * 10, secs = Math.round(S.totalMs / 1000);
  $('#barfill').style.width = '100%';
  show('s-result');
  S.savedRemote = null; S.resSecs = secs;
  paintResult();
  track('game_finish', { level: S.level, score, secs });
  try { window.HGPlays && HGPlays.end({ score, secs, name: S.name }); } catch (e) {}
  const remote = await saveScore(S.level, score, secs);
  S.savedRemote = remote;
  paintResult();
}
function paintResult() {
  const score = S.correct * 10;
  $('#r-title').textContent = T('result');
  $('#r-level').textContent = T('lv')[S.level - 1];
  $('#r-score').textContent = score;
  $('#r-time').textContent = T('score', { c: S.correct, N: S.qs.length }) + ' · ' + T('time', { t: S.resSecs });
  $('#r-saved').textContent = S.savedRemote === null ? '' : (S.savedRemote ? T('saved') : T('savedLocal'));
  $('#r-again').textContent = T('again');
  $('#r-board').textContent = '🏆 ' + T('board');
  $('#r-home').textContent = T('home');
}
let boardLevel = 1;
async function openBoard(level) {
  boardLevel = level || S.level || 1;
  show('s-board');
  $('#b-title').textContent = '🏆 ' + T('board');
  $('#b-back').textContent = T('back');
  const tabs = $('#b-tabs'); tabs.innerHTML = '';
  for (let i = 1; i <= 6; i++) {
    const b = document.createElement('button'); b.className = 'chip' + (i === boardLevel ? ' on' : '');
    b.textContent = T('lv')[i - 1]; b.style.fontSize = '12px';
    b.onclick = () => openBoard(i); tabs.appendChild(b);
  }
  const t = $('#b-table'); t.innerHTML = '';
  $('#b-note').textContent = '…';
  const { rows, remote } = await fetchBoard(boardLevel);
  $('#b-note').textContent = remote ? T('best') : T('localNote');
  if (!rows.length) { t.innerHTML = '<tr><td style="border:0;color:var(--muted)">' + T('empty') + '</td></tr>'; return; }
  let h = '<tr><th>#</th><th>' + T('player') + '</th><th>' + T('pts2') + '</th><th>' + T('sec') + '</th></tr>';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    h += '<tr><td>' + (i + 1) + '</td><td></td><td>' + r.score + '</td><td>' + r.time + '</td></tr>';
  });
  t.innerHTML = h;
  [...t.querySelectorAll('tr')].slice(1).forEach((tr, i) => { tr.children[1].textContent = rows[i].name; });
}

/* ---------- vocabulary panel ---------- */
function toggleVocab() { if (S.q) openModal('vocab'); }
function buildVocab() {
  const v = $('#vocab');
  if (!S.q) return;
  const m = DATA.maps[S.q.map];
  v.innerHTML = '<h4>' + T('vocabDir') + '</h4><div class="g" id="vg1"></div><h4>' + T('vocabWords') + '</h4><div class="g" id="vg3"></div><h4>' + T('vocabPlaces') + '</h4><div class="g" id="vg2"></div>';
  const fill = (id, rows) => {
    const g = $(id);
    rows.forEach(r => {
      const d = document.createElement('div');
      const b = document.createElement('b'); b.textContent = r[0]; d.appendChild(b);
      const ph = phText(r[1]);
      if (ph) { const p = document.createElement('span'); p.className = 'py'; p.textContent = ph; d.appendChild(p); }
      if (showTrans()) { const t = document.createElement('span'); t.className = 'fo'; t.textContent = r[2]; d.appendChild(t); }
      g.appendChild(d);
    });
  };
  fill('#vg1', ['straight', 'left', 'right', 'cross'].map(k => [W(k), WPY[k], (WTR[S.lang] || {})[k]]));
  fill('#vg3', USEFUL.map(u => [u[sk()], u.py, u[S.lang]]));
  const keys = [];
  (S.q.blocks || m.blocks).forEach(r => r.forEach(k => keys.push(k)));
  fill('#vg2', keys.map(k => { const b = DATA.buildings[k]; return [S.script === 'trad' ? b.tw : b.cn, b.py, b[S.lang]]; }));
}
// re-draw whatever screen is showing after the settings changed (e.g. in another tab)
function refreshAll() {
  if ($('#s-start').classList.contains('on')) { S.name = $('#name').value; renderStart(); }
  else if ($('#s-game').classList.contains('on') && S.q) {
    applyGameLabels(); renderSentence(); renderMap(); redraw(); renderFeedback();
    if (!$('#modal').classList.contains('hidden') && modalKind === 'vocab') buildVocab();
  }
  else if ($('#s-result').classList.contains('on')) paintResult();
  else if ($('#s-board').classList.contains('on')) openBoard(boardLevel);
}
window.addEventListener('storage', e => {
  if (e.key !== null && e.key !== SETTINGS_KEY) return;
  Object.assign(S, readShared());
  refreshAll();
});

/* ---------- wiring ---------- */
function bind() {
  $('#b-L').onclick = () => act('L');
  $('#b-S').onclick = () => act('S');
  $('#b-R').onclick = () => act('R');
  $('#b-C').onclick = () => act('C');
  [1, 2, 3, 4].forEach(k => { $('#b-' + k).onclick = () => act(String(k)); });
  $('#btn-cam').onclick = () => { S.cam = S.cam === 'all' ? 'follow' : 'all'; updateCamBtn(); setCam(false); };
  $('#btn-npart').onclick = nextPart;
  if (window.ResizeObserver) new ResizeObserver(() => document.documentElement.style.setProperty('--dockh', $('#dock').offsetHeight + 'px')).observe($('#dock'));
  $('#b-reset').onclick = resetPos;
  $('#b-go').onclick = submit;
  $('#btn-say').onclick = speakCurrent;
  const reveal = () => { if (S.locked || !S.q || S.rev >= 2) return; S.rev++; renderSentence(); };
  $('#btn-reveal').onclick = reveal; $('#btn-reveal2').onclick = reveal;
  $('#btn-vocab').onclick = toggleVocab;
  window.addEventListener('resize', setVocabLabel);
  $('#btn-restart').onclick = () => { stopSpeech(); leaveAt = Date.now(); openModal('leave'); };
  $('#lv-keep').onclick = closeModal;
  $('#lv-re').onclick = () => { leaveAt = 0; stopSpeech(); closeModal(); startGame(S.level); };
  $('#lv-home').onclick = () => { leaveAt = 0; stopSpeech(); closeModal(); renderStart(); show('s-start'); };
  ['#i-set', '#g-set'].forEach(id => { $(id).onclick = () => openModal('set'); });
  ['#i-help', '#g-help'].forEach(id => { $(id).onclick = () => openModal('help'); });
  $('#m-close').onclick = closeModal;
  $('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  $('#btn-board').onclick = () => openBoard(1);
  $('#r-again').onclick = () => startGame(S.level);
  $('#r-board').onclick = () => openBoard(S.level);
  $('#r-home').onclick = () => { renderStart(); show('s-start'); };
  $('#b-back').onclick = () => { renderStart(); show('s-start'); };
  $('#name').addEventListener('input', () => { $('#name').classList.remove('err'); S.name = $('#name').value; });
  document.addEventListener('keydown', e => {
    if (!$('#s-game').classList.contains('on') || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') act('L'); else if (e.key === 'ArrowRight') act('R'); else if (e.key === 'ArrowUp') { e.preventDefault(); act('S'); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); act('C'); }
    else if (e.key === 'Enter') { if (!S.locked) submit(); else if ($('#fb-next')) nextQuestion(); }
  });
}
loadSettings(); bind(); avPick(); renderStart();
function loadSpecific(q) {   // used by the automated tests
  S.level = q.level; S.qs = [q]; S.qi = 0; S.correct = 0; S.results = []; S.totalMs = 0;
  show('s-game'); applyGameLabels(); loadQuestion();
}
window.__askdir = { S, DATA, act, submit, startGame, nextQuestion, nextPart, resetPos, loadSpecific, fullTxt, replay };
</script>

<script>
/* ===== 遊玩紀錄（hgPlays）— 每個遊戲共用，貼在 </body> 前 =====
   用法：
     HGPlays.visit();                       // 頁面打開時（本檔會自動呼叫一次）
     HGPlays.start('easy', '小明');         // 真的開始玩一局（關卡／難度、暱稱都可省略）
     HGPlays.end({score: 120, name: '小明'}); // 這一局正常結算（score、name 可省略）
   沒呼叫 end 的那一局，後台就會顯示「沒玩完」。
   寫到 memorma 專案：plays（每局）、visits（每台裝置每天每遊戲一筆）。
   兩者都會多帶一個 tz（玩家裝置的時區，例如 America/Mexico_City），後台用它推測玩家來自哪個國家；抓不到就不帶。
   （memorma 的 Firestore 規則要允許 tz 欄位，主檔在 game-kit 的 firebase-rules/memorma-24dab.rules.txt）
   任何錯誤都靜默，不影響遊戲。 */
(function () {
  var GAME = 'perdido';          // ← 每個遊戲改成自己的代號（英文小寫、底線）
  var NAME_GETTER = null;                // ← 可選：function(){ return 目前暱稱或'' }
  var CFG = { apiKey: 'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60', authDomain: 'memorma-24dab.firebaseapp.com',
              projectId: 'memorma-24dab', appId: '1:806709458465:web:f0d12acb2f911f2f165560' };
  var V = '10.12.2', CDN = 'https://www.gstatic.com/firebasejs/' + V + '/';
  var cur = null, readyP = null, lib = null;

  function tzName() { // 玩家裝置的時區；抓不到就回空字串（這時紀錄不帶 tz）
    try { return String(Intl.DateTimeFormat().resolvedOptions().timeZone || '').slice(0, 64); } catch (e) { return ''; }
  }
  var TZ = tzName();

  function gid() { try { return (HG.gameFn ? HG.gameFn() : GAME) || GAME; } catch (e) { return GAME; } } // taiwan-life 這類共用引擎的遊戲可改寫 HGPlays.gameFn
  function day() { // 以台灣時間（UTC+8）算「哪一天」，方便老師對帳
    var d = new Date(Date.now() + 8 * 3600e3);
    return d.toISOString().slice(0, 10);
  }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function ready() {
    if (readyP) return readyP;
    readyP = (async function () {
      var A = await import(CDN + 'firebase-app.js');
      var Au = await import(CDN + 'firebase-auth.js');
      var F = await import(CDN + 'firebase-firestore.js');
      var app = A.initializeApp(CFG, 'hgplays');
      var auth = Au.getAuth(app);
      if (!auth.currentUser) await Au.signInAnonymously(auth);
      else await auth.authStateReady();
      lib = { F: F, db: F.getFirestore(app), uid: auth.currentUser.uid };
      return lib;
    })().catch(function () { readyP = null; return null; });
    return readyP;
  }
  function getName(n) {
    if (n) return String(n).slice(0, 36);
    try { if (NAME_GETTER) return String(NAME_GETTER() || '').slice(0, 36); } catch (e) {}
    return '';
  }

  var HG = window.HGPlays = {
    /* 每台裝置每天、每個遊戲只算一次訪客 */
    visit: function () {
      var g = gid(), d = day(), key = 'hg.visit.' + g;
      if (ls(key) === d) return;
      ready().then(function (L) {
        if (!L) return;
        var id = d + '_' + g + '_' + L.uid;
        var v = { game: g, day: d, uid: L.uid, at: L.F.serverTimestamp() };
        if (TZ) v.tz = TZ;
        return L.F.setDoc(L.F.doc(L.db, 'visits', id), v)
          .then(function () { ls(key, d); });
      }).catch(function () {});
    },
    /* 真的開始玩一局 */
    start: function (level, name) {
      var mine = cur = { id: null, level: level == null ? '' : String(level).slice(0, 30) };
      ready().then(function (L) {
        if (!L) return;
        var data = { game: gid(), level: mine.level, uid: L.uid, name: getName(name), day: day(),
                     startedAt: L.F.serverTimestamp(), done: false };
        if (TZ) data.tz = TZ;
        return L.F.addDoc(L.F.collection(L.db, 'plays'), data).then(function (ref) {
          mine.id = ref.id; if (mine.pendingEnd) HG._finish(mine, mine.pendingEnd);
        });
      }).catch(function () {});
    },
    /* 這一局正常結算 */
    end: function (info) {
      var mine = cur; if (!mine || mine.ended) return; mine.ended = true; info = info || {};
      if (mine.id) HG._finish(mine, info); else mine.pendingEnd = info; // 開始的寫入還沒回來就先記著
    },
    _finish: function (mine, info) {
      ready().then(function (L) {
        if (!L || !mine.id) return;
        var u = { done: true, endedAt: L.F.serverTimestamp(),
                  secs: Math.max(0, Math.min(86400, Math.round(Number(info.secs != null ? info.secs : (Date.now() - (mine.t0 || Date.now())) / 1000) || 0))) };
        var s = Number(info.score); if (isFinite(s) && info.score != null) u.score = Math.max(-1e9, Math.min(1e9, Math.round(s)));
        var n = getName(info.name); if (n) u.name = n;
        return L.F.updateDoc(L.F.doc(L.db, 'plays', mine.id), u);
      }).catch(function () {});
    }
  };
  var _s = HG.start; HG.start = function (l, n) { _s(l, n); if (cur) cur.t0 = Date.now(); };
  setTimeout(function () { HG.visit(); }, 2500);   // 等遊戲載完再記訪客
})();
</script>
